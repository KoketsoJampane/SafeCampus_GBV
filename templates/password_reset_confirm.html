{% extends 'base.html' %}
{% block title %}Set New Password - SafeCampus{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6 col-lg-5">
        <div class="card border-0 shadow-lg" style="border-radius: 20px;">
            <div class="card-body p-5 text-center">
                <div style="width: 70px; height: 70px; margin: 0 auto 15px; background: #2d6a4f; border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                    <i class="fas fa-lock fa-2x text-white"></i>
                </div>
                <h3 class="fw-bold mb-2" style="color: #0d2137;">Set New Password</h3>
                <p class="text-muted small mb-4">Please enter your new password twice so we can verify you typed it correctly.</p>

                <form method="post" class="text-start">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-lg w-100 text-white fw-bold mt-3" style="background: #2d6a4f; border-radius: 12px;">
                        Change My Password
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
