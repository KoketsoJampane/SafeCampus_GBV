<!-- base.html -->
{% extends 'base.html' %}

{% block title %}Login - SafeCampus{% endblock %}

{% block extra_css %}
<style>
    .login-wrapper {
        min-height: 85vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 60px 20px;
    }
    
    .login-card {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(20px);
        border-radius: 28px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.2);
        padding: 60px 55px;
        max-width: 600px; /* Made it much wider */
        width: 100%;
        border: 1px solid rgba(255, 255, 255, 0.3);
    }
    
    .login-logo {
        text-align: center;
        margin-bottom: 35px;
    }
    
    .login-logo .icon-circle {
        width: 90px;
        height: 90px;
        background: linear-gradient(135deg, #0d2137, #1a3a5c);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 20px;
        color: white;
        font-size: 2.5rem;
        box-shadow: 0 10px 30px rgba(13, 33, 55, 0.25);
    }
    
    .login-logo h1 {
        font-size: 2.2rem;
        font-weight: 700;
        color: #0d2137;
        letter-spacing: -0.5px;
        margin: 0;
    }
    
    .login-logo h1 span {
        color: #e86a4a;
    }
    
    .login-logo p {
        color: #6c757d;
        font-size: 1rem;
        margin-top: 8px;
    }
    
    .form-group {
        margin-bottom: 24px;
    }
    
    .form-group label {
        display: block;
        color: #0d2137;
        font-weight: 600;
        font-size: 0.95rem;
        margin-bottom: 10px;
    }
    
    .form-group label i {
        color: #e86a4a;
        margin-right: 6px;
    }
    
    .input-group-custom {
        position: relative;
    }
    
    .input-group-custom input {
        width: 100%;
        padding: 18px 18px 18px 50px;
        border: 2px solid #e8e0d8;
        border-radius: 14px;
        font-size: 1.05rem;
        transition: all 0.3s ease;
        background: rgba(255, 255, 255, 0.9);
        font-family: 'Inter', sans-serif;
        color: #0d2137;
    }
    
    .input-group-custom input:focus {
        outline: none;
        border-color: #e86a4a;
        background: white;
        box-shadow: 0 0 0 4px rgba(232, 106, 74, 0.1);
    }
    
    .input-group-custom .input-icon {
        position: absolute;
        left: 18px;
        top: 50%;
        transform: translateY(-50%);
        color: #b0b8c1;
        font-size: 1.1rem;
        transition: color 0.3s ease;
    }
    
    .input-group-custom input:focus + .input-icon {
        color: #e86a4a;
    }
    
    .btn-login {
        width: 100%;
        padding: 18px;
        background: linear-gradient(135deg, #0d2137, #1a3a5c);
        border: none;
        border-radius: 14px;
        color: white;
        font-size: 1.1rem;
        font-weight: 600;
        transition: all 0.3s ease;
        font-family: 'Inter', sans-serif;
        margin-top: 10px;
    }
    
    .btn-login:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 30px rgba(13, 33, 55, 0.35);
    }
    
    .login-footer {
        margin-top: 28px;
        text-align: center;
        color: #6c757d;
        font-size: 0.95rem;
    }
    
    .login-footer a {
        color: #e86a4a;
        text-decoration: none;
        font-weight: 600;
    }
    
    .login-footer a:hover {
        color: #0d2137;
    }
    
    .divider-text {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 25px 0;
        color: #b0b8c1;
        font-size: 0.85rem;
        font-weight: 600;
    }
    
    .divider-text::before,
    .divider-text::after {
        content: '';
        flex: 1;
        height: 1px;
        background: #e8e0d8;
    }

</style>
{% endblock %}

{% block content %}
<div class="login-wrapper">
    <div class="login-card">
        
        <!-- Logo -->
        <div class="login-logo">
            <div class="icon-circle">
                <i class="fas fa-hand-holding-heart"></i>
            </div>
            <h1>Safe<span>Campus</span></h1>
            <p>Welcome back! Let's keep our community safe</p>
        </div>
        
        <!-- Login Form -->
        <form method="post">
            {% csrf_token %}
            
            <!-- Username -->
            <div class="form-group">
                <label for="username">
                    <i class="fas fa-user"></i>Username
                </label>
                <div class="input-group-custom">
                    <input type="text" 
                           name="username" 
                           id="username" 
                           placeholder="Enter your username" 
                           required>
                    <i class="fas fa-user input-icon"></i>
                </div>
            </div>
            
            <!-- Password -->
            <div class="form-group">
                <label for="password">
                    <i class="fas fa-lock"></i>Password
                </label>
                <div class="input-group-custom">
                    <input type="password" 
                           name="password" 
                           id="password" 
                           placeholder="Enter your password" 
                           required>
                    <i class="fas fa-lock input-icon"></i>
                </div>
            </div>
            
            <!-- Submit -->
                        <button type="submit" class="btn-login">
                <i class="fas fa-arrow-right me-2"></i>Sign In
            </button>
        </form>
        
        <!-- ADD THE FORGOT PASSWORD LINK HERE -->
        <div class="text-center mt-3 mb-4">
            <a href="{% url 'password_reset_request' %}" style="color: #e86a4a; font-weight: 600; font-size: 0.9rem; text-decoration: none;">
                Forgot your password?
            </a>
        </div>

        <div class="divider-text">OR</div>
        
        <div class="login-footer">
            New to SafeCampus? <a href="{% url 'register' %}">Create an account</a>
        </div>
    </div>
</div>
{% endblock %}
